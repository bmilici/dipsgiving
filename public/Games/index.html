<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dipsgiving Games</title>
  <style>
    :root {
      --ink: #173039;
      --gold: #ffd44d;
      --cream: #fff8df;
      --green: #3b8f53;
      --blue: #244e82;
      --deep-blue: #12244a;
      --line: rgba(23, 48, 57, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent 36%),
        linear-gradient(180deg, #9bdcff 0%, #d4f5ff 36%, #68bf63 36%, #4d9f48 100%);
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 8px;
      color: #10213d;
      font-weight: 900;
      text-decoration: none;
      background: var(--gold);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5.6vw, 4.5rem);
      line-height: 1;
      color: #12353b;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.48);
    }

    .section {
      margin: 0 0 34px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      font-size: clamp(1.45rem, 3vw, 2.35rem);
      font-weight: 900;
      color: #14372d;
    }

    .section-title::after {
      content: "";
      height: 4px;
      flex: 1;
      border-radius: 999px;
      background: rgba(20, 55, 45, 0.18);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 16px;
    }

    .game-tile {
      position: relative;
      min-height: 310px;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.84);
      border-radius: 8px;
      color: white;
      text-decoration: none;
      box-shadow: 0 16px 36px rgba(21, 64, 59, 0.25);
      transform: translateY(0);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .game-tile:hover,
    .game-tile:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 20px 42px rgba(21, 64, 59, 0.34);
      outline: none;
    }

    .game-title {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      z-index: 3;
      transform: translateY(-50%);
      padding: 0 18px;
      text-align: center;
      font-size: clamp(2rem, 6.6vw, 4.6rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 6px 0 rgba(0, 0, 0, 0.28);
    }

    .roach-preview {
      background:
        linear-gradient(180deg, rgba(139, 212, 255, 0.78) 0%, rgba(210, 245, 255, 0.78) 30%, rgba(88, 182, 91, 0.88) 31%, rgba(54, 132, 70, 0.96) 100%);
    }

    .roach-preview::before,
    .math-preview::before,
    .space-preview::before,
    .titanic-preview::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(8, 25, 31, 0.16);
      z-index: 2;
    }

    .letter-card {
      position: absolute;
      top: 22%;
      width: 24%;
      aspect-ratio: 1.8 / 1.1;
      border-radius: 8px;
      background: rgba(255, 249, 232, 0.86);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.16);
    }

    .letter-card.left { left: 8%; }
    .letter-card.mid { left: 38%; }
    .letter-card.right { right: 8%; }

    .letter-card::after {
      content: attr(data-letter);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      font-weight: 900;
    }

    .roach {
      position: absolute;
      left: 50%;
      bottom: 42px;
      z-index: 1;
      width: 126px;
      height: 78px;
      transform: translateX(-50%);
    }

    .roach::before {
      content: "";
      position: absolute;
      inset: 18px 8px 8px;
      border-radius: 50%;
      background: #5d321f;
      box-shadow: inset 0 0 0 18px #7b452d;
      transform: rotate(0deg);
    }

    .roach::after {
      content: "";
      position: absolute;
      left: 47px;
      top: 26px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #101010;
      box-shadow: 27px 0 0 #101010;
    }

    .space-preview {
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.55) 0 2px, transparent 3px),
        radial-gradient(circle at 54% 22%, rgba(255, 255, 255, 0.5) 0 2px, transparent 3px),
        radial-gradient(circle at 83% 14%, rgba(255, 255, 255, 0.52) 0 2px, transparent 3px),
        linear-gradient(180deg, #13244d 0%, #244f83 76%, #286c6a 77%, #14372d 100%);
    }

    .math-preview {
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.6) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.52) 0 2px, transparent 3px),
        radial-gradient(circle at 86% 24%, rgba(255, 255, 255, 0.5) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 78%, #5a79d8 0 74px, transparent 75px),
        linear-gradient(180deg, #101834 0%, #24447d 72%, #2e738e 100%);
    }

    .titanic-preview {
      background:
        linear-gradient(180deg, rgba(8, 25, 31, 0.02) 0%, rgba(8, 25, 31, 0.22) 52%, rgba(8, 25, 31, 0.54) 100%),
        url("/TitanicAdventureAcademy/all-aboard-loading.webp") center / cover;
    }

    .question-bubble {
      position: absolute;
      left: 50%;
      top: 24px;
      z-index: 1;
      width: 190px;
      height: 70px;
      transform: translateX(-50%);
      border: 4px solid rgba(255, 212, 77, 0.9);
      border-radius: 8px;
      background: rgba(255, 249, 232, 0.94);
      color: var(--ink);
      font-size: 2rem;
      font-weight: 900;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    }

    .answer-rock {
      position: absolute;
      z-index: 1;
      width: 84px;
      height: 74px;
      border-radius: 45% 55% 48% 52%;
      background: #7f8aa1;
      box-shadow: inset -10px -8px 0 rgba(0, 0, 0, 0.16);
      color: white;
      font-size: 2rem;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    .answer-rock.one { right: 12%; top: 32%; }
    .answer-rock.two { right: 28%; top: 52%; background: #8c7a68; }
    .answer-rock.three { right: 7%; top: 65%; background: #6d8295; }

    .cloud {
      position: absolute;
      z-index: 1;
      width: 112px;
      height: 48px;
      border-radius: 999px;
      background: rgba(169, 186, 217, 0.28);
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      bottom: 12px;
      border-radius: 50%;
      background: rgba(169, 186, 217, 0.32);
    }

    .cloud::before {
      left: 20px;
      width: 58px;
      height: 58px;
    }

    .cloud::after {
      right: 14px;
      width: 44px;
      height: 44px;
    }

    .cloud.one { left: 8%; top: 22%; }
    .cloud.two { right: 12%; top: 32%; transform: scale(0.9); }

    .ship {
      position: absolute;
      left: 11%;
      bottom: 58px;
      z-index: 1;
      width: 142px;
      height: 78px;
      clip-path: polygon(0 50%, 68% 14%, 100% 50%, 68% 86%);
      background: linear-gradient(90deg, #52617a, #8c99aa);
    }

    .ship::before {
      content: "";
      position: absolute;
      left: -46px;
      top: 28px;
      width: 62px;
      height: 20px;
      background: #ffd44d;
      clip-path: polygon(0 50%, 100% 0, 72% 50%, 100% 100%);
    }

    .empty-note {
      margin: 0;
      padding: 18px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.44);
      font-weight: 800;
    }

    @media (max-width: 680px) {
      .page {
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .game-tile {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <h1>Games</h1>
      <a class="home-link" href="/">Home</a>
    </div>

    <section class="section" aria-labelledby="kindergarten-title">
      <h2 id="kindergarten-title" class="section-title">Kindergarten</h2>
      <div class="game-grid">
        <a class="game-tile roach-preview" href="/desmondgame" aria-label="Open Letter Roach">
          <span class="letter-card left" data-letter="A"></span>
          <span class="letter-card mid" data-letter="M"></span>
          <span class="letter-card right" data-letter="T"></span>
          <span class="roach" aria-hidden="true"></span>
          <span class="game-title">Letter Roach</span>
        </a>
        <a class="game-tile titanic-preview" href="/TitanicAdventureAcademy" aria-label="Open Titanic Adventure">
          <span class="game-title">Titanic Adventure</span>
        </a>
      </div>
    </section>

    <section class="section" aria-labelledby="first-grade-title">
      <h2 id="first-grade-title" class="section-title">1st Grade</h2>
      <div class="game-grid">
        <a class="game-tile math-preview" href="/FirstGradeMath" aria-label="Open Math Rocket Rescue">
          <span class="question-bubble">7 + 5 = ?</span>
          <span class="ship" aria-hidden="true"></span>
          <span class="answer-rock one">10</span>
          <span class="answer-rock two">12</span>
          <span class="answer-rock three">14</span>
          <span class="game-title">Math Rocket Rescue</span>
        </a>
      </div>
    </section>

    <section class="section" aria-labelledby="fun-title">
      <h2 id="fun-title" class="section-title">Fun</h2>
      <div class="game-grid">
        <a class="game-tile space-preview" href="/NicoGames" aria-label="Open Space Flyer">
          <span class="cloud one" aria-hidden="true"></span>
          <span class="cloud two" aria-hidden="true"></span>
          <span class="ship" aria-hidden="true"></span>
          <span class="game-title">Space Flyer</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
