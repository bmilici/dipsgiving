<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Five9 Embedded Chat – Clean</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f9f9f9;
    }

    /* No button needed anymore, but keeping style here in case you add it back */
    #clickToChat {
      display: none;
      margin: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #65758e;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    #clickToChat:hover { background: #4B5DFF; }

    #chatWidgetContainer {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 360px;
      max-width: 90vw;
      height: 520px;
      max-height: 80vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      overflow: hidden;
      z-index: 9999;
    }
  </style>
  <!-- Five9 Chat Wrapper -->
  <script src="https://cdn.prod.us.five9.net/static/stable/chat/wrapper/index.js"></script>
</head>
<body>
  <!-- No visible button anymore -->
  <button id="clickToChat">Click to Chat</button>

  <!-- Embedded container -->
  <div id="chatWidgetContainer" aria-live="polite"></div>

  <script>
    const INTEGRATION_ID = "642f0167b3069f011ac9b1a8"; // replace if needed
    let five9Mounted = false;
    let notificationsHooked = false;

    /************* BROWSER NOTIFICATIONS *************/

    async function requestNotificationPermission() {
      if (!("Notification" in window)) {
        console.log("Browser does not support notifications");
        return false;
      }

      if (Notification.permission === "granted") {
        return true;
      }

      if (Notification.permission === "denied") {
        // user already denied – don't nag
        return false;
      }

      try {
        const result = await Notification.requestPermission();
        return result === "granted";
      } catch (e) {
        console.warn("Notification permission request failed:", e);
        return false;
      }
    }

    function notifyNewChatMessage(from, text) {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;

      // Optional: only notify when page is not focused
      if (document.hasFocus()) {
        return;
      }

      const title = from || "New chat message";
      const body = text || "You have a new message in your chat.";

      try {
        new Notification(title, { body });
      } catch (e) {
        console.warn("Unable to show notification:", e);
      }
    }

    // Hacky but effective: watch for Five9 debug logs that look like:
    // ["SCC_DEBUG: message", { displayName: "...", content: "..." }]
    function hookConsoleForFive9Messages() {
      if (notificationsHooked) return;
      notificationsHooked = true;

      const originalInfo = console.info ? console.info.bind(console) : null;

      console.info = function (...args) {
        try {
          if (
            args &&
            typeof args[0] === "string" &&
            args[0].includes("SCC_DEBUG: message")
          ) {
            const payload = args[1];
            if (payload && typeof payload === "object") {
              const from = payload.displayName || "Support";
              const text = payload.content || "";
              notifyNewChatMessage(from, text);
            }
          }
        } catch (e) {
          // swallow errors so we don't break normal logging
          console.warn("Error in console.info hook:", e);
        }

        if (originalInfo) {
          return originalInfo(...args);
        }
      };
    }

    /************* FIVE9 EMBEDDED CHAT *************/

    function mountFive9Embedded() {
      return new Promise((resolve) => {
        if (five9Mounted) return resolve();

        F9.Chat.Wrapper.init({
          cdn: "prod",
          useBusinessHours: false,
          // debug helps ensure those SCC_DEBUG logs appear
          debug: true,
          l10n: {
            en: {
              messenger: { customText: {} },
              systemMessages: {
                transferredToParticipant:
                  "The chat has been transferred to {name}.",
                transferredToGroup:
                  "The chat has been transferred to group {group}.",
              },
              captureFields: [
                { k: "name", l: "Name", p: "Enter your name..." },
                { k: "email", l: "Email Address", p: "Enter your email..." },
                {
                  k: "Question",
                  l: "Question",
                  p: "What can we help you with today?",
                },
              ],
            },
          },
          prepopulatedFields: [{ k: "campaign", v: "UC CHAT" }],
          messenger: {
            integrationId: INTEGRATION_ID,
            embedded: true,
            embeddedContainerId: "chatWidgetContainer",
            displayStyle: "embedded",
            soundNotificationEnabled: true,
            transcriptPrintingEnabled: false,
            menuItems: {
              imageUpload: true,
              fileUpload: true,
              shareLocation: true,
            },
            browserStorage: "sessionStorage",
            customColors: {
              brandColor: "65758e",
              conversationColor: "4B5DFF",
              actionColor: "4B5DFF",
            },
          },
          clearMessagesTimeout: 3,
        });

        five9Mounted = true;
        resolve();
      });
    }

    const box = document.getElementById("chatWidgetContainer");

    // Auto-open on page load (no button needed)
    document.addEventListener("DOMContentLoaded", () => {
      if (box) {
        box.style.display = "block";
      }

      (async () => {
        await mountFive9Embedded();

        // Ask for notification permission early
        await requestNotificationPermission();

        const api = F9?.Chat?.Wrapper?.api;
        if (api?.open) {
          try {
            api.open();
          } catch (e) {
            console.warn(e);
          }
        }

        // Start listening to Five9 debug logs for incoming messages
        hookConsoleForFive9Messages();
      })();

      // Remove the old built-in minimize button if present
      const oldMinBtn = document.getElementById("minus");
      if (oldMinBtn) {
        oldMinBtn.remove();
        console.log("Old minimize button removed");
      }
    });
  </script>
</body>
</html>
