<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Five9 Embedded Chat – Dipsgiving</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f9f9f9;
    }

    #clickToChat {
      margin: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #65758e;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    #clickToChat:hover { background: #4B5DFF; }

    #chatWidgetContainer {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 360px;
      max-width: 90vw;
      height: 520px;
      max-height: 80vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      overflow: hidden;
      z-index: 9999;
    }
  </style>
  <!-- Five9 Chat Wrapper -->
  <script src="https://cdn.prod.us.five9.net/static/stable/chat/wrapper/index.js"></script>
</head>
<body>
  <button id="clickToChat">Click to Chat</button>

  <!-- Embedded container -->
  <div id="chatWidgetContainer" aria-live="polite"></div>

  <script>
    const INTEGRATION_ID = "642f0167b3069f011ac9b1a8"; // replace if needed
    let five9Mounted = false;
    let five9EventsBound = false;

    // ---- Notification helpers ---------------------------------------

    async function ensureNotificationPermission() {
      if (!("Notification" in window)) {
        console.log("Notifications not supported in this browser.");
        return false;
      }

      if (Notification.permission === "granted") return true;

      if (Notification.permission !== "denied") {
        const result = await Notification.requestPermission();
        return result === "granted";
      }

      return false;
    }

    function isPageVisible() {
      return document.visibilityState === "visible";
    }

    function maybeNotify(title, body) {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;
      if (isPageVisible()) return; // don't notify if they're actively on the page

      try {
        new Notification(title, {
          body,
          tag: "dipsgiving-chat", // collapse multiple notifications
        });
      } catch (e) {
        console.warn("Notification error:", e);
      }
    }

    // Handler we’ll hook into Five9 events
    function handleIncomingChatMessage(messagePayload) {
      // Try to grab some text from the payload if it exists
      const text =
        (messagePayload && (messagePayload.text || messagePayload.body || messagePayload.message)) ||
        "New message from Dipsgiving Support";
      maybeNotify("Dipsgiving Support", text);
    }

    // ---- Five9 init --------------------------------------------------

    function mountFive9Embedded() {
      return new Promise((resolve) => {
        if (five9Mounted) {
          bindFive9EventsIfPossible();
          return resolve();
        }

        F9.Chat.Wrapper.init({
          cdn: "prod",
          useBusinessHours: false,
          l10n: {
            en: {
              messenger: { customText: {} },
              systemMessages: {
                transferredToParticipant: "The chat has been transferred to {name}.",
                transferredToGroup: "The chat has been transferred to group {group}."
              },
              captureFields: [
                { k: "name", l: "Name", p: "Enter your name..." },
                { k: "email", l: "Email Address", p: "Enter your email..." },
                { k: "Question", l: "Question", p: "What can we help you with today?" }
              ]
            }
          },
          prepopulatedFields: [{ k: "campaign", v: "UC CHAT" }],
          messenger: {
            integrationId: INTEGRATION_ID,
            embedded: true,
            embeddedContainerId: "chatWidgetContainer",
            displayStyle: "embedded",
            soundNotificationEnabled: true,
            transcriptPrintingEnabled: false,
            menuItems: { imageUpload: true, fileUpload: true, shareLocation: true },
            browserStorage: "sessionStorage",
            customColors: {
              brandColor: "#65758e",
              conversationColor: "#4B5DFF",
              actionColor: "#4B5DFF"
            }
          },
          clearMessagesTimeout: 3
        });

        five9Mounted = true;
        bindFive9EventsIfPossible();
        resolve();
      });
    }

    // Try to hook into message events from the Five9 wrapper
    function bindFive9EventsIfPossible() {
      if (five9EventsBound) return;

      const api = F9 && F9.Chat && F9.Chat.Wrapper && F9.Chat.Wrapper.api;
      if (!api) {
        // API not ready yet; we'll try again next time init is called
        return;
      }

      // NOTE:
      // The event name here is an EXAMPLE. Different environments may expose
      // different event APIs. If Five9 gives you a specific event like
      // "messageReceived" or "chatMessage", update this accordingly.
      //
      // This is written defensively so if api.on doesn't exist, nothing breaks.
      if (typeof api.on === "function") {
        try {
          // Example event name: "messageReceived"
          api.on("messageReceived", (payload) => {
            handleIncomingChatMessage(payload);
          });
          five9EventsBound = true;
          console.log("Five9 chat message listener bound.");
        } catch (e) {
          console.warn("Could not bind Five9 events:", e);
        }
      } else {
        console.log("Five9 API has no .on() method; update event wiring if needed.");
      }
    }

    // ---- UI wiring ---------------------------------------------------

    const box = document.getElementById("chatWidgetContainer");
    const openBtn = document.getElementById("clickToChat");

    openBtn.addEventListener("click", async () => {
      box.style.display = "block";

      await mountFive9Embedded();

      // Ask for notification permission when they open chat
      await ensureNotificationPermission();

      const api = F9 && F9.Chat && F9.Chat.Wrapper && F9.Chat.Wrapper.api;
      if (api && typeof api.open === "function") {
        try { api.open(); } catch (e) { console.error(e); }
      }
    });

    // Remove the old built-in minimize button if present
    document.addEventListener("DOMContentLoaded", () => {
      const oldMinBtn = document.getElementById("minus");
      if (oldMinBtn) {
        oldMinBtn.remove();
        console.log("Old minimize button removed");
      }
    });
  </script>
</body>
</html>
